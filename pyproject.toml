[project]
name = "agentoscopy"
version = "0.2.0"
description = "Evaluation harness for LLM agents"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10",
    "anthropic>=1.11",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.scripts]
agentoscopy = "agentoscopy.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Docker daemon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
