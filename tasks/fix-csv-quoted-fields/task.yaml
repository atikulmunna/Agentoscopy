id: fix-csv-quoted-fields
category: bugfix
difficulty: medium
tags:
- parsing
instructions: 'parse_line in csvline.py splits a CSV line on every comma, which breaks quoted fields.

  Follow the usual CSV rules: a field in double quotes may contain commas, and a doubled

  double quote inside it stands for one double quote.

  '
environment:
  base_image: python:3.12-slim@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
  workdir: /workspace
budget:
  timeout_s: 300
graders:
- name: hidden_tests
  type: command
  run: python -m unittest discover -s /hidden
  weight: 0.8
- name: existing_tests
  type: command
  run: python -m unittest discover -s tests
  weight: 0.2
- name: no_tamper
  type: tamper_check
  protected_paths:
  - /workspace/tests/**
  - '**/conftest.py'
  weight: 0
