id: add-retry-decorator
category: feature
difficulty: hard
tags:
- decorators
instructions: 'Implement retry(times, exceptions) in retrying.py: a decorator that calls the function
  up

  to `times` times while it raises one of `exceptions` (a tuple of exception types), and

  re-raises the last error if every call fails. Other exceptions pass through at once. The

  decorated function keeps its name and docstring.

  '
environment:
  base_image: python:3.12-slim@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
  workdir: /workspace
budget:
  timeout_s: 300
graders:
- name: hidden_tests
  type: command
  run: python -m unittest discover -s /hidden
  weight: 0.8
- name: existing_tests
  type: command
  run: python -m unittest discover -s tests
  weight: 0.2
- name: no_tamper
  type: tamper_check
  protected_paths:
  - /workspace/tests/**
  - '**/conftest.py'
  weight: 0
