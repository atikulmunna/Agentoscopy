id: fix-roman-subtractive
category: bugfix
difficulty: medium
tags:
- strings
- math
instructions: 'to_roman in roman.py writes 4 as IIII and 9 as VIIII. Use the standard subtractive forms

  (IV, IX, XL, XC, CD, CM). Numbers outside 1 to 3999 should raise ValueError.

  '
environment:
  base_image: python:3.12-slim@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
  workdir: /workspace
budget:
  timeout_s: 300
graders:
- name: hidden_tests
  type: command
  run: python -m unittest discover -s /hidden
  weight: 0.8
- name: existing_tests
  type: command
  run: python -m unittest discover -s tests
  weight: 0.2
- name: no_tamper
  type: tamper_check
  protected_paths:
  - /workspace/tests/**
  - '**/conftest.py'
  weight: 0
