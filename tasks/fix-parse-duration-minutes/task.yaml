id: fix-parse-duration-minutes
category: bugfix
difficulty: medium
tags:
- parsing
instructions: 'parse_duration in durations.py turns strings like ''1h30m'' or ''45s'' into seconds, but
  gets

  minutes wrong. Text that is not a duration (such as ''abc'' or '''') should raise ValueError.

  Fix both.

  '
environment:
  base_image: python:3.12-slim@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
  workdir: /workspace
budget:
  timeout_s: 300
graders:
- name: hidden_tests
  type: command
  run: python -m unittest discover -s /hidden
  weight: 0.8
- name: existing_tests
  type: command
  run: python -m unittest discover -s tests
  weight: 0.2
- name: no_tamper
  type: tamper_check
  protected_paths:
  - /workspace/tests/**
  - '**/conftest.py'
  weight: 0
