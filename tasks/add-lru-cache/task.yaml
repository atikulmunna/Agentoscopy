id: add-lru-cache
category: feature
difficulty: hard
tags:
- collections
instructions: 'Implement LRUCache in lru.py: LRUCache(capacity) with get(key, default=None) and

  put(key, value). When a put would exceed the capacity, the least recently used entry is

  evicted; both get and put count as a use. A capacity below 1 raises ValueError. len()

  gives the number of entries.

  '
environment:
  base_image: python:3.12-slim@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
  workdir: /workspace
budget:
  timeout_s: 300
graders:
- name: hidden_tests
  type: command
  run: python -m unittest discover -s /hidden
  weight: 0.8
- name: existing_tests
  type: command
  run: python -m unittest discover -s tests
  weight: 0.2
- name: no_tamper
  type: tamper_check
  protected_paths:
  - /workspace/tests/**
  - '**/conftest.py'
  weight: 0
