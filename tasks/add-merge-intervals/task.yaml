id: add-merge-intervals
category: feature
difficulty: medium
tags:
- algorithms
instructions: 'Implement merge_intervals(intervals) in intervals.py. Given (start, end) pairs in any

  order, return the merged, sorted list of pairs, where overlapping or touching intervals

  become one: [(1, 3), (2, 6), (8, 10)] gives [(1, 6), (8, 10)].

  '
environment:
  base_image: python:3.12-slim@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
  workdir: /workspace
budget:
  timeout_s: 300
graders:
- name: hidden_tests
  type: command
  run: python -m unittest discover -s /hidden
  weight: 0.8
- name: existing_tests
  type: command
  run: python -m unittest discover -s tests
  weight: 0.2
- name: no_tamper
  type: tamper_check
  protected_paths:
  - /workspace/tests/**
  - '**/conftest.py'
  weight: 0
