id: add-deep-merge
category: feature
difficulty: medium
tags:
- collections
instructions: 'Implement deep_merge(base, override) in config_merge.py. It returns a new dict with the

  keys of both; where both values are dicts they are merged the same way, otherwise the

  override wins (lists are replaced, not combined). Neither input may be modified.

  '
environment:
  base_image: python:3.12-slim@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
  workdir: /workspace
budget:
  timeout_s: 300
graders:
- name: hidden_tests
  type: command
  run: python -m unittest discover -s /hidden
  weight: 0.8
- name: existing_tests
  type: command
  run: python -m unittest discover -s tests
  weight: 0.2
- name: no_tamper
  type: tamper_check
  protected_paths:
  - /workspace/tests/**
  - '**/conftest.py'
  weight: 0
